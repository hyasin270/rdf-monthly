<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Fraunces:ital,wght@1,500&display=swap"><title>RDF Monthly Roll-up</title><style>
:root{--bg:#F7F6F2;--ink:#0F1A33;--muted:#5B6473;--line:#DAD7CF;--card:#FFFFFF;--navy:#001F3F;--gold:#F5B301;--c:#001F3F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E1524;--ink:#EEF0F4;--muted:#A6ADBB;--line:#2A3448;--card:#151F33;--navy:#EEF0F4}}
:root[data-theme="dark"]{--bg:#0E1524;--ink:#EEF0F4;--muted:#A6ADBB;--line:#2A3448;--card:#151F33;--navy:#EEF0F4}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:32px 28px 80px}
h1{font:italic 500 40px/1.1 Fraunces,Georgia,serif;margin:0 0 8px;color:var(--navy)}
.lede{max-width:68ch;color:var(--muted);margin:0 0 6px}
.rule{height:3px;width:72px;background:var(--gold);margin:14px 0 26px}
nav{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 34px}
nav a,.months a{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;color:var(--ink);text-decoration:none;background:var(--card);font-weight:500}
nav a span,.months a span{font-size:12px;color:var(--muted);font-weight:400}
.months{display:flex;flex-direction:column;gap:10px;max-width:420px}
section{margin:0 0 56px;padding-top:12px;border-top:1px solid var(--line)}
section header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 16px}
h2{font:700 22px/1.2 Inter,sans-serif;margin:0;padding-left:12px;border-left:5px solid var(--c)}
.meta{color:var(--muted);margin:0;font-size:13px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(560px,1fr));gap:18px}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figcaption{font-size:13px;color:var(--ink);padding:10px 12px;border-top:1px solid var(--line);white-space:pre-wrap}
figcaption b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.closer{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-top:14px;white-space:pre-wrap}
footer{color:var(--muted);font-size:12px;margin-top:40px}
@media (max-width:640px){.panels{grid-template-columns:1fr}.wrap{padding:20px 14px 60px}}
</style></head><body><div class="wrap"><h1>Monthly roll-up</h1><p class="lede">The routine data flow, month by month, for every region and the combined card. Updated automatically by each monthly run on the first working day of the month.</p><div class="rule"></div><div class="months"><a href="months/2026-08/index.html" style="--c:#001F3F">August 2026<span>5 of 7 regions · Combined, Islamabad, Rawalpindi, Moawin, Kenya</span></a></div></div></body></html>
